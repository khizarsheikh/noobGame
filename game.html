<!DOCTYPE html>
<html>
<head>
	<link rel="stylesheet" type="text/css" href="css/game.css">
	<title>Game</title>
</head>
<body>
	<div id="wrapper">
		<div id="buttons">
			<button id="start">Start</button>
			<button id="again">Play Again</button>	
		</div>
		
		<div id="game">
			<div id="points">
				Score: <p id="score">0</p>
				Record: <p id="record">0</p></div>
			<div id="character"><img src="graphics/car.jpg"></div>
			<div id="block"><img src="graphics/hill.png"></div>
			<div id="over">Game Over</div>
			<div id="white"></div>
		</div>
	</div>

</body>
<script type="text/javascript" src="js/game.js" defer=""></script>
</html>
